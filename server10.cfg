// **************************************************************************** //
// Left 4 Dead 2 - Vanilla Dedicated Server Configuration
// **************************************************************************** //

// --- Basic Settings ---
hostname "[CL] MK-Servers #10"
rcon_password "emeka.19"
sv_password ""                   // Leave blank for public, or add a password for private
sv_steamgroup "46226821"                 // Steam Group ID if you want to reserve slots/group priority
sv_steamgroup_exclusive "0"

// --- Logging & RCON ---
log on
sv_logbans 1
sv_logecho 1
sv_logfile 1
sv_log_onefile 0
net_maxfilesize 64

// --- Rates & Performance (Optimized for 30/60/100 tick) ---
sv_minrate 30000
sv_maxrate 100000
sv_minupdaterate 30
sv_maxupdaterate 101
sv_mincmdrate 30
sv_maxcmdrate 101
sv_client_min_interp_ratio -1
sv_client_max_interp_ratio 2

// --- Game Play Settings ---
sv_lan 0                         // 0 = Internet server, 1 = LAN only
sv_region 2                      // 0: US East, 1: US West, 2: South America, 3: Europe, 4: Asia, 5: Australia, 6: Middle East, 7: Africa, 255: World
sv_search_lobby_distance 3       // Closest lobbies first

// --- Communication ---
sv_alltalk 0                     // 0 = Team only, 1 = Everyone hears everyone
decalfrequency 60

// --- Exec Mapcycle ---
mapcyclefile "cfg/mapcycle.txt"
