services:
  l4d2:
    image: left4devops/l4d2
    network_mode: host
    restart: unless-stopped
    environment:
      # Identidad y ubicación
      HOSTNAME: "[CL] MK Server"
      REGION: "2" # 0=Este EEUU, 1=Oeste EEUU, 2=Sudamérica, 3=Europa, 4=Asia, 5=Australia, 6=Medio Oriente, 7=África, 255=Mundo

      # Mensaje del día
      MOTD: "0" # 1=activado, 0=desactivado
      HOST_CONTENT: "" # Texto o URL http del banner
      MOTD_CONTENT: "" # Contenido del MOTD

      # Grupo de Steam
      STEAM_GROUP: "46226821" # ID numérico del grupo; 0=desactivado
      STEAM_GROUP_EXCLUSIVE: "" # Déjalo vacío para desactivar; cualquier valor no vacío lo activa

      # Partida
      DEFAULT_MAP: "c14m1_junkyard"
      DEFAULT_MODE: "coop"
      GAME_TYPES: "" # Vacío permite todos; ejemplo: coop,realism,versus,survival
      FORK: "10" # Diez instancias con configuraciones server01.cfg a server10.cfg
      PORT: "" # Vacío o 0=asignación automática; fija aquí un puerto si quieres definirlo
      LAN: "" # Déjalo vacío para desactivar; cualquier valor no vacío activa LAN

      # Administración remota
      RCON_PASSWORD: "${RCON_PASSWORD:-}" # Define el secreto RCON en las variables de Dokploy
      NET_CON_PORT: "0" # 0=desactivado
      NET_CON_PASSWORD: "${NET_CON_PASSWORD:-}" # Define el secreto NetCon en las variables de Dokploy

      # Argumentos adicionales de srcds
      EXTRA_ARGS: ""

    volumes:
      - ../files/l4d2-addons:/addons
      - ./server01.cfg:/cfg/server01.cfg:ro
      - ./server02.cfg:/cfg/server02.cfg:ro
      - ./server03.cfg:/cfg/server03.cfg:ro
      - ./server04.cfg:/cfg/server04.cfg:ro
      - ./server05.cfg:/cfg/server05.cfg:ro
      - ./server06.cfg:/cfg/server06.cfg:ro
      - ./server07.cfg:/cfg/server07.cfg:ro
      - ./server08.cfg:/cfg/server08.cfg:ro
      - ./server09.cfg:/cfg/server09.cfg:ro
      - ./server10.cfg:/cfg/server10.cfg:ro
      - ./mapcycle.txt:/cfg/mapcycle.txt:ro
